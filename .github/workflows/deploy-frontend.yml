name: Deploy frontend

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, closed]

  # By hand from the Actions tab, e.g. after a variable of the build was changed
  workflow_dispatch:

# Every run of this workflow pushes to the same branch (gh-pages), so they are run one at a time:
# two at once, e.g. the deploy of a merge and the removal of the preview of the merged pull request,
# fail on each other's push. A run waits for the one before it instead of cancelling it.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      PAGES_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set BASE_HREF for PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: echo "BASE_HREF=/pr-${{ github.event.number }}/" >> $GITHUB_ENV

      - run: npm ci
        if: github.event.action != 'closed'

      # The address of the backend the frontend connects to, e.g. https://api.scorch.mobile
      - run: npm run build
        if: github.event.action != 'closed'
        env:
          API_URL: ${{ vars.API_URL }}
          # The test phones are always there in the previews of pull requests, in production by the variable
          PLAYER_TESTING_MODE: ${{ github.event_name == 'pull_request' && 'true' || vars.PLAYER_TESTING_MODE }}
          # The previews of pull requests show which commit they were built of
          COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}

      - run: git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - run: git config --global user.name "github-actions[bot]"

      # A push to gh-pages can still be refused, when the branch changed after it was fetched (e.g. by
      # the build of GitHub Pages itself, or by a run that was started by hand). It is then tried again.
      - name: Deploy production (main)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          echo "scorch.mobile" > dist/CNAME

          for attempt in 1 2 3; do
            if npx gh-pages -d dist --message "Production deploy: ${GITHUB_SHA}" --repo="$PAGES_REPO"; then exit 0; fi
            echo "::warning::The deploy failed (attempt $attempt), trying again"
            npx gh-pages-clean
            sleep $((attempt * 10))
          done
          exit 1

      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: |
          for attempt in 1 2 3; do
            if npx gh-pages -d dist --dest=pr-${{ github.event.number }} \
              --message "PR preview deploy: PR #${{ github.event.number }}" --repo="$PAGES_REPO"; then exit 0; fi
            echo "::warning::The deploy failed (attempt $attempt), trying again"
            npx gh-pages-clean
            sleep $((attempt * 10))
          done
          exit 1

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            🚀 **PR Preview Updated**

            👉 https://scorch.mobile/pr-${{ github.event.number }}/

      - name: Remove PR preview
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        run: |
          preview="pr-${{ github.event.number }}"

          for attempt in 1 2 3; do
            # A fresh copy of the branch for each attempt: the old one is what the push was refused for
            rm -rf gh-pages-branch
            git clone --depth=1 "$PAGES_REPO" --branch gh-pages gh-pages-branch
            cd gh-pages-branch

            if [ ! -d "$preview" ]; then
              echo "Preview directory not found, nothing to delete."
              exit 0
            fi

            echo "Removing preview $preview"
            git rm -r --quiet "$preview"
            git commit --quiet -m "Remove preview for PR #${{ github.event.number }}"
            if git push; then exit 0; fi

            echo "::warning::The push was refused (attempt $attempt), trying again"
            cd ..
            sleep $((attempt * 10))
          done
          exit 1
